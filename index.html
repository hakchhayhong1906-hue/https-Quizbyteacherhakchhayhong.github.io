<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>តេស្តសមត្ថភាព Microsoft Word (15 សំណួរ) - ACLS</title>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #071933;
      --bg-container: #0D2B52;
      --bg-card: #13396B;
      --bg-input: #0A2242;
      --accent-blue: #2979FF;
      --accent-hover: #1565C0;
      --border-color: #26538D;
      --text-white: #FFFFFF;
      --text-muted: #CBD5E1;
      --success-bg: #1B5E20;
      --success-border: #4CAF50;
      --error-bg: #B71C1C;
      --error-border: #EF5350;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kantumruy Pro', sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-white);
      line-height: 1.6;
      padding: 20px 15px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-container);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .header {
      background: linear-gradient(135deg, #091E3A, #16447D);
      color: var(--text-white);
      padding: 28px 24px;
      text-align: center;
      border-bottom: 3px solid var(--accent-blue);
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-white);
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .form-body {
      padding: 24px;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Student Info Grid */
    .student-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      background-color: var(--bg-card);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: var(--text-white);
    }

    .form-group input,
    .form-group select {
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      background-color: var(--bg-input);
      color: var(--text-white);
    }

    .form-group input::placeholder {
      color: #94A3B8;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--accent-blue);
    }

    /* Question Cards */
    .question-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .question-card:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .question-text {
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 12px;
      color: var(--text-white);
    }

    .badge-point {
      background-color: var(--accent-blue);
      color: var(--text-white);
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 700;
      margin-left: 6px;
      display: inline-block;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background-color: var(--bg-input);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-white);
      transition: all 0.2s;
    }

    .option-label:hover {
      background-color: #194A8A;
      border-color: var(--accent-blue);
    }

    .option-label input[type="radio"] {
      accent-color: var(--accent-blue);
      width: 18px;
      height: 18px;
      margin-right: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Highlight States after Submit */
    .option-correct {
      background-color: var(--success-bg) !important;
      border-color: var(--success-border) !important;
      color: var(--text-white) !important;
      font-weight: 600;
    }

    .option-wrong {
      background-color: var(--error-bg) !important;
      border-color: var(--error-border) !important;
      color: var(--text-white) !important;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 14px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 140px;
      padding: 13px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-white);
    }

    .btn-submit {
      background-color: var(--accent-blue);
      box-shadow: 0 4px 12px rgba(41, 121, 255, 0.35);
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      background-color: #475569;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-reset {
      background-color: #1E4976;
      border: 1.5px solid var(--border-color);
    }

    .btn-reset:hover {
      background-color: #275C94;
    }

    /* Result Box */
    #resultCard {
      display: none;
      margin-top: 28px;
      padding: 22px;
      border-radius: 12px;
      background-color: var(--bg-card);
      border: 2px solid var(--accent-blue);
      text-align: center;
      color: var(--text-white);
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: var(--bg-input);
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      border: 4px solid var(--accent-blue);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .score-circle span {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-white);
    }

    .score-circle small {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    #saveStatus {
      margin-top: 10px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 1.3rem;
      }
      .form-body {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Quiz 1</h1>
    <p>BY TEAHCER HAK CHHAYHONG (១៥ សំណួរ - ៣០ ពិន្ទុ)</p>
  </div>

  <div class="form-body">
    <form id="quizForm">
      <!-- ព័ត៌មានអ្នកសិក្សា -->
      <div class="section-title">ព័ត៌មានអ្នកសិក្សា</div>
      <div class="student-info">
        <div class="form-group">
          <label for="fullName">ឈ្មោះអ្នកសិក្សា *</label>
          <input type="text" id="fullName" placeholder="បញ្ចូលឈ្មោះពេញ..." required>
        </div>

        <div class="form-group">
          <label for="gender">ភេទ *</label>
          <select id="gender" required>
            <option value="">-- ជ្រើសរើសភេទ --</option>
            <option value="ប្រុស">ប្រុស</option>
            <option value="ស្រី">ស្រី</option>
          </select>
        </div>

        <div class="form-group">
          <label for="studyTime">ម៉ោងសិក្សា *</label>
          <select id="studyTime" required>
            <option value="">-- ជ្រើសរើសម៉ោងសិក្សា --</option>
            <option value="8:00 - 9:00 AM">8:00 - 9:00 AM</option>
            <option value="9:00 - 10:00 AM">9:00 - 10:00 AM</option>
            <option value="10:00 - 11:00 AM">10:00 - 11:00 AM</option>
            <option value="1:00 - 2:00 PM">1:00 - 2:00 PM</option>
            <option value="2:00 - 3:00 PM">2:00 - 3:00 PM</option>
            <option value="3:00 - 4:00 PM">3:00 - 4:00 PM</option>
            <option value="4:00 - 5:00 PM">4:00 - 5:00 PM</option>
          </select>
        </div>
      </div>

      <!-- ផ្នែកសំណួរ -->
      <div class="section-title">
        <span>សំណួរពហុជ្រើសរើស Microsoft Word</span>
        <span style="font-size: 0.9rem; color: var(--text-muted);">២ ពិន្ទុ / សំណួរ</span>
      </div>
      <div id="quizContainer"></div>

      <!-- ប៊ូតុង -->
      <div class="btn-group">
        <button type="submit" class="btn-submit" id="submitBtn">បញ្ជូនចម្លើយ (Submit)</button>
        <button type="button" class="btn-reset" id="resetBtn">សម្អាតទិន្នន័យ (Reset)</button>
      </div>
    </form>

    <!-- ប្រអប់បង្ហាញលទ្ធផល -->
    <div id="resultCard">
      <div class="score-circle">
        <span id="scoreDisplay">0/30</span>
        <small>ពិន្ទុសរុប</small>
      </div>
      <h2 id="resultTitle" style="margin-bottom: 6px; color: #FFFFFF;"></h2>
      <p id="studentSummary" style="color: var(--text-muted); font-size: 0.95rem;"></p>
      <div id="saveStatus"></div>
    </div>
  </div>
</div>

<script>
  // ដាក់ Web App URL របស់ Google Apps Script នៅទីនេះ
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzp3JJOYo2AEYUfufOEB6dd1aV2UY-DckYj0Sph4rXPaLf8dK-uvvtz6bhPplihOEeC8A/exec";

    {

    },
    {
      question: "១៣. នៅក្នុង Table Layout តើ Tool \"Merge Cells\" មានមុខងារធ្វើអ្វី?",
      options: {
        A: "បំបែក Cell មួយឱ្យទៅជាច្រើន",
        B: "បញ្ចូល Cell ច្រើនឱ្យក្លាយជា Cell តែមួយ",
        C: "លុបតារាងទាំងមូលចោល",
        D: "បន្ថែមជួរដេកខាងលើ"
      },
      correct: "B"
    },
    {
      question: "១៤. ដើម្បីបង្កើតតារាងមាតិកាដោយស្វ័យប្រវត្តិ (Table of Contents) តើអ្នកត្រូវចូលទៅកាន់ផ្ទាំង (Tab) មួយណា?",
      options: {
        A: "References Tab",
        B: "Mailings Tab",
        C: "Review Tab",
        D: "View Tab"
      },
      correct: "A"
    },
    {
      question: "១៥. ប្រសិនបើអ្នកចង់ដាក់លេខសម្ងាត់ការពារឯកសារ (Encrypt with Password) តើអ្នកត្រូវចូលតាមជំហានណា?",
      options: {
        A: "File > Save As > PDF",
        B: "File > Info > Protect Document > Encrypt with Password",
        C: "Insert > Header & Footer > Page Number",
        D: "Layout > Page Setup > Margins"
      },
      correct: "B"
    }
  ];

  const quizContainer = document.getElementById("quizContainer");
  const quizForm = document.getElementById("quizForm");
  const resultCard = document.getElementById("resultCard");
  const submitBtn = document.getElementById("submitBtn");
  const resetBtn = document.getElementById("resetBtn");

  // បង្ហាញសំណួរលើអេក្រង់
  function renderQuiz() {
    quizContainer.innerHTML = "";
    quizData.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "question-card";
      card.id = `q-card-${index}`;

      let optionsHTML = "";
      for (const [key, value] of Object.entries(item.options)) {
        optionsHTML += `
          <label class="option-label" id="label-${index}-${key}">
            <input type="radio" name="question${index}" value="${key}" required>
            <span><strong>${key}.</strong> ${value}</span>
          </label>
        `;
      }

      card.innerHTML = `
        <div class="question-text">${item.question} <span class="badge-point">២ ពិន្ទុ</span></div>
        <div class="options-list">${optionsHTML}</div>
      `;
      quizContainer.appendChild(card);
    });
  }

  // គណនាពិន្ទុ និងបញ្ជូនទៅ Google Sheets
  quizForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const gender = document.getElementById("gender").value;
    const studyTime = document.getElementById("studyTime").value;

    let score = 0;
    let selectedAnswers = [];

    quizData.forEach((item, index) => {
      const selected = document.querySelector(`input[name="question${index}"]:checked`);
      const userAns = selected ? selected.value : "";
      selectedAnswers.push(`Q${index + 1}:${userAns}`);

      const allRadios = document.querySelectorAll(`input[name="question${index}"]`);
      allRadios.forEach(r => r.disabled = true);

      const correctLabel = document.getElementById(`label-${index}-${item.correct}`);
      correctLabel.classList.add("option-correct");

      if (userAns === item.correct) {
        score += 2;
      } else if (userAns) {
        const wrongLabel = document.getElementById(`label-${index}-${userAns}`);
        wrongLabel.classList.add("option-wrong");
      }
    });

    const totalPoints = quizData.length * 2; // 30 ពិន្ទុ
    const status = score >= 18 ? "ជាប់ (Passed)" : "ធ្លាក់ (Failed)";

    // បង្ហាញលទ្ធផល
    document.getElementById("scoreDisplay").textContent = `${score}/${totalPoints}`;
    const resultTitle = document.getElementById("resultTitle");
    resultTitle.textContent = score >= 18 ? "អបអរសាទរ! អ្នកបានប្រឡងជាប់ 🎉" : "សូមព្យាយាមម្តងទៀត! 💪";

    document.getElementById("studentSummary").textContent =
      `អ្នកសិក្សា៖ ${fullName} | ភេទ៖ ${gender} | ម៉ោងសិក្សា៖ ${studyTime} | ស្ថានភាព៖ ${status}`;

    resultCard.style.display = "block";
    resultCard.scrollIntoView({ behavior: "smooth" });
    submitBtn.disabled = true;

    // រក្សាទុកទៅ Google Sheets
    const saveStatus = document.getElementById("saveStatus");
    if (SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL" || !SCRIPT_URL) {
      saveStatus.style.color = "#FACC15";
      saveStatus.textContent = "⚠️ មិនទាន់បានភ្ជាប់ SCRIPT_URL របស់ Google Sheets នៅឡើយទេ។";
      return;
    }

    saveStatus.style.color = "#93C5FD";
    saveStatus.textContent = "⏳ កំពុងរក្សាទុកទិន្នន័យទៅ Google Sheets...";

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fullName: fullName,
        gender: gender,
        studyTime: studyTime,
        score: score,
        status: status,
        answers: selectedAnswers.join(", ")
      })
    })
    .then(() => {
      saveStatus.style.color = "#86EFAC";
      saveStatus.textContent = "✅ ទិន្នន័យត្រូវបានរក្សាទុកទៅក្នុង Google Sheets ដោយជោគជ័យ!";
    })
    .catch((err) => {
      saveStatus.style.color = "#FCA5A5";
      saveStatus.textContent = "❌ មានបញ្ហាក្នុងការរក្សាទុកទិន្នន័យ៖ " + err.message;
    });
  });

  // ប៊ូតុង Reset
  resetBtn.addEventListener("click", function () {
    quizForm.reset();
    resultCard.style.display = "none";
    submitBtn.disabled = false;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ចាប់ផ្តើមបង្ហាញសំណួរ
  renderQuiz();
</script>

</body>
</html>
